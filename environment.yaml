# Ambiente conda do ADEX Copiloto para o OCI Data Science (JupyterLab 4.4.6).
# Publicar com:  odsc conda create -f environment.yaml --name adex-copiloto --version 0.1.0
#                odsc conda publish -s adex-copiloto_v0_1_0
# As versões abaixo foram as testadas na implementação (21/10/2026). A stack de
# orquestração fica fixada: o Deep Agents ainda está na série 0.x.
name: adex-copiloto
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip
  - pip:
      - pydantic==2.14.1
      - tomli-w==1.2.0
      - cryptography==50.0.2
      - pycryptodome==4.1.0
      - httpx==0.28.1
      - numpy==2.4.6
      - pandas==3.0.6
      - pyarrow==26.0.0
      - scipy==1.17.1
      - statsmodels==0.15.0
      - scikit-learn==1.9.1
      - matplotlib==3.11.2
      - sqlglot==30.24.0
      - duckdb==1.5.6
      - openai==3.35.1
      - langchain==1.4.6
      - langchain-core==1.6.12
      - langchain-openai==1.7.2
      - langgraph==1.2.16
      - langgraph-checkpoint-sqlite==3.1.2
      - deepagents==0.7.28
      - langfuse==4.18.0          # servidor 4.49: SDK 4.x (o 5 exige servidor >= 4.59)
      - opentelemetry-exporter-otlp-proto-http==1.45.1
      - oracledb==26.0.1          # modo thin (sem Instant Client)
      - oci>=2.130
      - ocifs>=1.3
      - ipywidgets==8.1.9
      - ipython>=8.20
      - ./                        # o próprio adex-copiloto (wheel na publicação)
