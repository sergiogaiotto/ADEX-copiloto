  <style>

         letter-spacing: -0.02em; line-height: 1.15; color: var(--color-ink); margin-bottom: 1.5rem; }

  </style>

<body>

    <h1>Onde o ADEX Copiloto roda na OCI</h1>

  <desc id="impl-desc">Diagrama de implantação com três zonas. Na zona OCI Data Science fica a notebook session, com a biblioteca adex_copiloto, langgraph 1.2.16, deepagents 0.7.28, langchain-openai 1.7.2 e o SDK 4 do Langfuse. Na zona de serviços OCI ficam o Autonomous Data Warehouse (mTLS na porta 1522, usuário só leitura), o Object Storage (estado, snapshots e handoff) e o Vault (chaves e credenciais). Na zona de acesso por URL e chave ficam o GPU Hub do CCOE, com o Qwen3.8-27B, e o Langfuse 4.49, que já existe numa máquina no Brasil. Hoje não há rota entre o notebook e o Langfuse; a máquina do Langfuse já chama o hub para usar o Qwen como avaliador.</desc>
